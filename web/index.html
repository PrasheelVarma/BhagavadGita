<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A beautiful devotional app to listen to Bhagavad Gita audio">
  <meta name="theme-color" content="#8E0E00">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bhagavad Gita">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bhagavad Gita</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #FFF8E7 0%, #FFE0B2 50%, #FAF7F2 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      background: linear-gradient(180deg, #FFF8E7 0%, #FFE0B2 50%, #FAF7F2 100%);
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }
    .loading-halo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #FFE082;
      border-top-color: #D32F2F;
      animation: spin 1.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 25px rgba(255, 179, 0, 0.35);
      margin-bottom: 24px;
    }
    .loading-title {
      font-size: 24px;
      font-weight: 800;
      color: #B71C1C;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .loading-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #6D4C41;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Hide Flutter default top loader if present */
    .flutter-loader {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loading-halo"></div>
    <div class="loading-title">Bhagavad Gita</div>
    <div class="loading-subtitle">✦ Song of the Spirit ✦</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
